{% extends "base.html" %}
{% block title %}Iniciar sesión — NumisBol{% endblock %}

{% block content %}
<div class="auth-wrapper">
    <div class="auth-card">

        <div class="auth-header">
            <h1>Iniciar sesión</h1>
            <p>Ingresá con tu cuenta de NumisBol</p>
        </div>

        {% if error %}
        <div class="alert alert-error">
            <span class="alert-icon">⚠</span>
            <span>{{ error }}</span>
        </div>
        {% endif %}

        <form method="post" action="/auth/login" class="auth-form" novalidate>
            <input type="hidden" name="next" value="{{ next }}">

            <div class="form-group">
                <label for="email">Correo electrónico</label>
                <input
                    type="email"
                    id="email"
                    name="email"
                    value="{{ form.email if form else '' }}"
                    placeholder="ejemplo@correo.com"
                    required
                    autofocus
                    autocomplete="email"
                >
            </div>

            <div class="form-group">
                <label for="password">Contraseña</label>
                <div class="input-password">
                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Su contraseña"
                        required
                        autocomplete="current-password"
                    >
                    <button type="button" class="toggle-password" data-target="password" title="Mostrar/ocultar contraseña">👁</button>
                </div>
            </div>

            <div class="auth-submit">
                <button type="submit" class="btn btn-primary btn-full btn-lg">
                    Iniciar sesión
                </button>
            </div>

            <div style="text-align:center; margin-top:.75rem;">
                <a href="/auth/recuperar" class="forgot-link">¿Olvidó su contraseña?</a>
            </div>
        </form>

        <div class="auth-footer">
            ¿No tiene cuenta? &nbsp;
            <a href="/auth/registro">Registrarse gratis</a>
        </div>
    </div>
</div>
{% endblock %}
